name: Feature
description: A capability inside an epic (days). Parent = an Epic.
labels: [type:feature]
body:
  - type: input
    id: parent
    attributes: { label: Parent epic, description: "#number. Then link this as a sub-issue of it.", placeholder: "#17" }
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes: { label: Outcome, description: "Who gets what capability." }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, value: "- [ ] " }
    validations: { required: true }
  - type: input
    id: reference
    attributes: { label: Reference, description: "Spec section or ADR." }
