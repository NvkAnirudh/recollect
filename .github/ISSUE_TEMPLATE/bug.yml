name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Include the X-Request-ID from the response if you have it." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
  - type: dropdown
    id: area
    attributes: { label: Area, options: [backend, frontend, slack, database, infra] }
